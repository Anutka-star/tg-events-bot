name: daily-events

on:
  schedule:
    - cron: '0 7 * * *'   # каждый день в 07:00 UTC = 10:00 по Москве
    - cron: '0 6 * * 1'   # понедельник 06:00 UTC = 09:00 МСК — дайджест недели
  workflow_dispatch:       # кнопка ручного запуска

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Сбор событий и отправка в Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            python parser.py --digest
          else
            python parser.py
          fi

      - name: Сохранение списка увиденных событий
        run: |
          git config user.name "events-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json events.json
          git diff --cached --quiet || git commit -m "обновление базы событий"
          git push
